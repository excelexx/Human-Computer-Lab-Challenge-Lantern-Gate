[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-emotion-checkin"
version = "0.1.0"
description = "Local text and vision emotion check-in trained on MELD"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "timm==0.9.16",
  "transformers==4.57.1", "huggingface-hub==0.36.0",
  "sentencepiece==0.2.1", "protobuf==5.29.5",
  "gradio==5.49.1", "opencv-python-headless==4.12.0.88",
  "numpy==2.2.6", "scikit-learn==1.7.2", "pydantic==2.11.9",
  "httpx==0.28.1", "psutil>=6,<8", "matplotlib>=3.9,<3.11"
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
checkin = "checkin.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
checkin = ["*.js", "assets/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
